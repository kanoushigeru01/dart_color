<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COLOR DARTS — カラーダーツゲーム</title>
<style>
  :root{
    --bg:#070a12;
    --panel:#111726;
    --panel2:#171f31;
    --line:#2b3650;
    --text:#f7f9ff;
    --muted:#9aa8bf;
    --cyan:#67e8f9;
    --purple:#a78bfa;
    --gold:#facc15;
    --red:#ef2b2d;
    --blue:#1769e8;
    --yellow:#ffd100;
    --green:#00a51a;
    --shadow:0 24px 80px rgba(0,0,0,.42);
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;
    color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    background:
      radial-gradient(circle at 50% -20%,rgba(103,232,249,.16),transparent 34%),
      radial-gradient(circle at 90% 30%,rgba(167,139,250,.11),transparent 28%),
      linear-gradient(180deg,#0a0f1c 0%,#070a12 70%);
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;inset:0;pointer-events:none;opacity:.18;
    background-image:
      linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:36px 36px;
    mask-image:linear-gradient(to bottom,black,transparent 80%);
  }
  .app{max-width:1440px;margin:0 auto;padding:20px clamp(14px,2vw,28px) 34px;position:relative;z-index:1}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    margin-bottom:16px;padding:14px 18px;border:1px solid var(--line);border-radius:18px;
    background:rgba(10,15,28,.78);backdrop-filter:blur(14px);box-shadow:var(--shadow)
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand-mark{
    width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:1000;
    background:conic-gradient(from -45deg,var(--red),var(--blue),var(--yellow),var(--green),var(--red));
    box-shadow:0 0 28px rgba(103,232,249,.22);color:#fff;text-shadow:0 2px 8px #000;
  }
  .brand h1{margin:0;font-size:clamp(19px,2.2vw,28px);letter-spacing:.04em;white-space:nowrap}
  .brand p{margin:2px 0 0;color:var(--muted);font-size:12px;letter-spacing:.08em}
  .hud{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .hud-chip{
    min-width:92px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:#0d1320;
    text-align:center;font-variant-numeric:tabular-nums
  }
  .hud-chip span{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
  .hud-chip strong{display:block;margin-top:2px;font-size:16px}

  .game-grid{display:grid;grid-template-columns:280px minmax(430px,1fr) 300px;gap:16px;align-items:start}
  .panel{
    border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(23,31,49,.96),rgba(12,17,29,.96));
    box-shadow:var(--shadow);overflow:hidden
  }
  .panel-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .panel-head h2{margin:0;font-size:14px;letter-spacing:.11em;text-transform:uppercase}
  .panel-body{padding:16px}

  .wheel-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .wheel-option{
    position:relative;border:1px solid var(--line);border-radius:16px;padding:14px 10px;background:#0d1320;
    color:var(--text);cursor:pointer;transition:.22s ease;text-align:center;user-select:none
  }
  .wheel-option:hover{transform:translateY(-2px);border-color:#485a80}
  .wheel-option.active{
    border-color:var(--cyan);background:linear-gradient(180deg,rgba(103,232,249,.12),rgba(103,232,249,.03));
    box-shadow:0 0 0 1px rgba(103,232,249,.25) inset,0 0 24px rgba(103,232,249,.08)
  }
  .wheel-option .num{display:block;font-size:30px;font-weight:1000;line-height:1}
  .wheel-option .label{display:block;margin-top:5px;color:var(--muted);font-size:11px;letter-spacing:.08em}

  .start-btn,.reset-btn{
    width:100%;border:0;border-radius:16px;cursor:pointer;font-weight:900;letter-spacing:.06em;
    transition:.2s ease;font-size:16px
  }
  .start-btn{
    margin-top:14px;padding:15px 16px;color:#07111a;
    background:linear-gradient(135deg,#fff 0%,#a5f3fc 45%,#67e8f9 100%);
    box-shadow:0 10px 28px rgba(103,232,249,.18)
  }
  .start-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 34px rgba(103,232,249,.25)}
  .start-btn:disabled{opacity:.45;cursor:not-allowed}
  .reset-btn{margin-top:9px;padding:11px 14px;color:var(--muted);background:#0c1220;border:1px solid var(--line)}
  .reset-btn:hover{color:#fff;border-color:#4a5d84}

  .mission{
    margin-top:14px;padding:14px;border-radius:16px;border:1px solid var(--line);background:#0b111d;min-height:118px
  }
  .mission .eyebrow{color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
  .mission strong{display:block;margin-top:7px;font-size:17px}
  .mission p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.65}
  .mission.attention{animation:missionPulse .9s ease-in-out infinite alternate;border-color:rgba(103,232,249,.55)}
  @keyframes missionPulse{from{box-shadow:0 0 0 rgba(103,232,249,0)}to{box-shadow:0 0 24px rgba(103,232,249,.15)}}

  .legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .legend-item{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
  .dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 10px currentColor}

  .stage-panel{padding:0;background:rgba(7,10,18,.84)}
  .stage-head{
    height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,#131b2b,#0e1421)
  }
  .stage-head .phase{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
  .phase-light{width:9px;height:9px;border-radius:50%;background:#64748b;box-shadow:0 0 12px #64748b}
  .phase-light.live{background:var(--cyan);box-shadow:0 0 16px var(--cyan)}
  .phase-light.ready{background:var(--gold);box-shadow:0 0 16px var(--gold);animation:blink .6s infinite alternate}
  .phase-light.done{background:#86efac;box-shadow:0 0 16px #86efac}
  @keyframes blink{to{opacity:.35}}
  .stage-head .hint{color:var(--muted);font-size:12px;text-align:right}

  .arena{
    position:relative;display:grid;place-items:center;min-height:620px;padding:18px;overflow:hidden;
    background:
      radial-gradient(circle at center,rgba(39,49,73,.72) 0 28%,rgba(10,14,24,.92) 62%),
      linear-gradient(180deg,#0d1320,#080b12)
  }
  .arena::before{
    content:"";position:absolute;width:78%;aspect-ratio:1;border-radius:50%;pointer-events:none;
    border:1px solid rgba(103,232,249,.12);box-shadow:0 0 80px rgba(103,232,249,.06),inset 0 0 80px rgba(103,232,249,.04)
  }
  .arena.spinning::before{animation:ringPulse 1.2s ease-in-out infinite alternate}
  .arena.ready::before{border-color:rgba(250,204,21,.42);box-shadow:0 0 95px rgba(250,204,21,.12),inset 0 0 70px rgba(250,204,21,.05)}
  .arena.impact{animation:impactShake .34s cubic-bezier(.2,.9,.3,1)}
  @keyframes ringPulse{to{transform:scale(1.025);opacity:.65}}
  @keyframes impactShake{
    0%{transform:translate(0,0)}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,1px)}100%{transform:translate(0,0)}
  }

  .canvas-wrap{position:relative;width:min(100%,680px);aspect-ratio:1;z-index:1}
  canvas{
    width:100%;height:100%;display:block;border-radius:50%;touch-action:none;user-select:none;
    filter:drop-shadow(0 24px 40px rgba(0,0,0,.45));
  }
  .arena.ready canvas{cursor:crosshair}
  .arena.ready .canvas-wrap{animation:targetBreathe .8s ease-in-out infinite alternate}
  @keyframes targetBreathe{to{filter:drop-shadow(0 0 22px rgba(250,204,21,.16))}}

  .game-overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3;text-align:center}
  .overlay-card{
    opacity:0;transform:scale(.82);transition:.18s ease;padding:14px 20px;border-radius:18px;
    background:rgba(5,8,14,.74);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(8px)
  }
  .game-overlay.show .overlay-card{opacity:1;transform:scale(1)}
  .overlay-big{font-weight:1000;font-size:clamp(46px,8vw,92px);line-height:.95;letter-spacing:-.04em;text-shadow:0 6px 30px rgba(0,0,0,.6)}
  .overlay-small{margin-top:8px;color:#dbeafe;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
  .game-overlay.ready .overlay-card{border-color:rgba(250,204,21,.55);box-shadow:0 0 44px rgba(250,204,21,.18)}
  .game-overlay.ready .overlay-big{font-size:clamp(28px,5vw,52px);color:#fde68a;animation:readyPop .75s ease-in-out infinite alternate}
  @keyframes readyPop{to{transform:scale(1.045)}}

  .impact-flash{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;background:radial-gradient(circle at var(--hit-x,50%) var(--hit-y,50%),rgba(255,255,255,.96) 0 1%,rgba(255,255,255,.34) 2%,transparent 13%)}
  .impact-flash.fire{animation:flash .36s ease-out}
  @keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}

  .result-banner{
    position:absolute;left:50%;bottom:18px;transform:translate(-50%,20px);z-index:5;
    min-width:min(82%,460px);padding:12px 16px;border-radius:16px;background:rgba(5,8,14,.9);
    border:1px solid var(--line);box-shadow:0 18px 44px rgba(0,0,0,.35);opacity:0;pointer-events:none;
    display:flex;align-items:center;justify-content:center;gap:12px;transition:.3s cubic-bezier(.2,.9,.3,1)
  }
  .result-banner.show{opacity:1;transform:translate(-50%,0)}
  .result-color{width:18px;height:18px;border-radius:50%;box-shadow:0 0 18px currentColor}
  .result-banner strong{font-size:17px}
  .result-banner span{color:var(--muted);font-size:12px}

  .stats-columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sector-stat-card{min-width:0;padding:12px;border-radius:14px;background:#0b111d;border:1px solid var(--line)}
  .sector-stat-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
  .sector-stat-head strong{font-size:16px;letter-spacing:.04em;white-space:nowrap}
  .sector-stat-head span{color:var(--muted);font-size:10px;white-space:nowrap}
  .compact-stat-row{display:grid;grid-template-columns:minmax(42px,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid rgba(255,255,255,.055)}
  .compact-stat-row:first-child{border-top:0}
  .compact-stat-name{display:flex;align-items:center;gap:6px;font-weight:800;font-size:12px;min-width:0}
  .compact-stat-value{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .compact-stat-value strong{font-size:12px;color:#fff}
  .compact-stat-value small{display:block;color:var(--muted);font-size:9px;margin-top:1px}
  .current-result{
    padding:13px;border-radius:15px;background:#0b111d;border:1px solid var(--line);min-height:76px;color:var(--muted);font-size:12px;line-height:1.55
  }
  .current-result .big-result{display:flex;align-items:center;gap:9px;color:#fff;font-size:20px;font-weight:1000;margin-bottom:5px}

  .howto{margin-top:14px;padding:13px;border-radius:15px;background:#0b111d;border:1px solid var(--line)}
  .howto ol{margin:0;padding-left:18px;color:var(--muted);font-size:12px;line-height:1.75}
  .howto b{color:#fff}

  .footer-note{margin:12px 2px 0;color:#718096;font-size:11px;line-height:1.6;text-align:center}

  @media(max-width:1120px){
    .game-grid{grid-template-columns:250px minmax(420px,1fr)}
    .right-panel{grid-column:1/-1}
  }
  @media(max-width:820px){
    .topbar{align-items:flex-start}.hud{display:none}
    .game-grid{grid-template-columns:1fr}
    .arena{min-height:auto;padding:10px}
    .left-panel{order:2}.stage-panel{order:1}.right-panel{order:3}
    .stage-head .hint{display:none}
  }
  @media(max-width:520px){
    .app{padding:10px 10px 24px}.topbar{padding:10px 12px;margin-bottom:10px;border-radius:14px}
    .stats-columns{gap:8px}
    .sector-stat-card{padding:10px 8px}
    .sector-stat-head strong{font-size:14px}
    .compact-stat-row{gap:5px;padding:6px 0}
    .compact-stat-name{font-size:11px;gap:5px}
    .compact-stat-value strong{font-size:11px}
    .brand-mark{width:36px;height:36px}.brand p{display:none}
    .panel{border-radius:16px}.panel-body{padding:13px}.stage-head{height:46px}
    .arena{padding:4px}.result-banner{bottom:8px;min-width:92%;padding:10px 12px}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">◎</div>
      <div>
        <h1>COLOR DARTS</h1>
        <p>SPIN · HIDE · AIM · THROW</p>
      </div>
    </div>
    <div class="hud">
      <div class="hud-chip"><span>Round</span><strong id="roundHud">01</strong></div>
      <div class="hud-chip"><span>Board</span><strong id="boardHud">4 SECTORS</strong></div>
      <div class="hud-chip"><span>Session</span><strong id="sessionHud">0 HITS</strong></div>
    </div>
  </header>

  <div class="game-grid">
    <aside class="panel left-panel">
      <div class="panel-head"><h2>Game Setup</h2><span style="color:var(--cyan);font-size:11px;font-weight:900">SELECT</span></div>
      <div class="panel-body">
        <div class="wheel-options">
          <button class="wheel-option active" data-wheel="4" type="button">
            <span class="num">4</span><span class="label">SECTORS</span>
          </button>
          <button class="wheel-option" data-wheel="8" type="button">
            <span class="num">8</span><span class="label">SECTORS</span>
          </button>
        </div>

      </div>
    </aside>

    <main class="panel stage-panel">
      <div class="stage-head">
        <div class="phase"><span class="phase-light" id="phaseLight"></span><span id="phaseText">ルーレットをクリックしよう！</span></div>
        <div class="hint" id="stageHint"></div>
      </div>
      <div class="arena" id="arena">
        <div class="canvas-wrap">
          <canvas id="board" width="800" height="800" aria-label="カラーダーツのルーレット"></canvas>
          <div class="game-overlay" id="gameOverlay">
            <div class="overlay-card">
              <div class="overlay-big" id="overlayBig"></div>
              <div class="overlay-small" id="overlaySmall"></div>
            </div>
          </div>
          <div class="impact-flash" id="impactFlash"></div>
          <div class="result-banner" id="resultBanner">
            <i class="result-color" id="resultColor"></i>
            <div><strong id="resultText">HIT!</strong><br><span id="resultSub">結果</span></div>
          </div>
        </div>
      </div>
    </main>

    <aside class="panel right-panel">
      <div class="panel-head"><h2>Session Stats</h2><span style="color:var(--purple);font-size:11px;font-weight:900">LIVE</span></div>
      <div class="panel-body">
        <div class="stats-columns">
          <section class="sector-stat-card">
            <div class="sector-stat-head"><strong>4分割</strong><span id="stats4Total">0 hits</span></div>
            <div id="stats4"></div>
          </section>
          <section class="sector-stat-card">
            <div class="sector-stat-head"><strong>8分割</strong><span id="stats8Total">0 hits</span></div>
            <div id="stats8"></div>
          </section>
        </div>
      </div>
    </aside>
  </div>

</div>

<script>
(() => {
  'use strict';

  const COLORS = [
    { key:'red', label:'赤', hex:'#ef2b2d' },
    { key:'blue', label:'青', hex:'#1769e8' },
    { key:'yellow', label:'黄', hex:'#ffd100' },
    { key:'green', label:'緑', hex:'#00a51a' }
  ];
  const PATTERNS = {
    4: [0,1,2,3],
    8: Array.from({length:8},(_,i)=>i%4)
  };

  const els = {
    board: document.getElementById('board'),
    arena: document.getElementById('arena'),
    phaseLight: document.getElementById('phaseLight'),
    phaseText: document.getElementById('phaseText'),
    stageHint: document.getElementById('stageHint'),
    gameOverlay: document.getElementById('gameOverlay'),
    overlayBig: document.getElementById('overlayBig'),
    overlaySmall: document.getElementById('overlaySmall'),
    impactFlash: document.getElementById('impactFlash'),
    resultBanner: document.getElementById('resultBanner'),
    resultColor: document.getElementById('resultColor'),
    resultText: document.getElementById('resultText'),
    resultSub: document.getElementById('resultSub'),
    stats4: document.getElementById('stats4'),
    stats8: document.getElementById('stats8'),
    stats4Total: document.getElementById('stats4Total'),
    stats8Total: document.getElementById('stats8Total'),
    roundHud: document.getElementById('roundHud'),
    boardHud: document.getElementById('boardHud'),
    sessionHud: document.getElementById('sessionHud'),
    options: Array.from(document.querySelectorAll('.wheel-option'))
  };

  const ctx = els.board.getContext('2d');
  const TAU = Math.PI * 2;
  const GEOM = { cx:400, cy:400, radius:292 };

  let selectedWheel = 4;
  let phase = 'idle'; // idle | spinningVisible | hiddenReady | throwing | finished
  let rotation = 0;
  let spinSpeed = 0;
  let colorHidden = false;
  let lastFrame = 0;
  let fadeStart = 0;
  const fadeDuration = 1000;
  let colorFade = 0;
  let hoverPoint = null;
  let lastHit = null;
  let throwAnim = null;
  let impactRing = null;
  let stats = createEmptyStats();

  function createEmptyStats(){
    return {
      totalGames:0,
      byWheel:{
        4:{total:0,counts:{red:0,blue:0,yellow:0,green:0}},
        8:{total:0,counts:{red:0,blue:0,yellow:0,green:0}}
      }
    };
  }

  function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
  function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
  function easeInCubic(t){ return t*t*t; }

  function setMission(){ /* mission panel removed */ }

  function setPhaseUI(kind,text,hint){
    els.phaseLight.className = 'phase-light' + (kind ? ' '+kind : '');
    els.phaseText.textContent = text;
    els.stageHint.textContent = hint;
  }

  function showOverlay(big,small,kind=''){
    els.overlayBig.textContent = big;
    els.overlaySmall.textContent = small;
    els.gameOverlay.className = 'game-overlay show' + (kind ? ' '+kind : '');
  }
  function hideOverlay(){ els.gameOverlay.className = 'game-overlay'; }

  function boardPointFromPointer(ev){
    const rect = els.board.getBoundingClientRect();
    return {
      x:(ev.clientX-rect.left)*(els.board.width/rect.width),
      y:(ev.clientY-rect.top)*(els.board.height/rect.height)
    };
  }

  function insideBoard(p){
    const dx=p.x-GEOM.cx, dy=p.y-GEOM.cy;
    return dx*dx+dy*dy <= GEOM.radius*GEOM.radius;
  }

  function normalizedPoint(p){
    const x=(p.x-GEOM.cx)/GEOM.radius;
    const y=(p.y-GEOM.cy)/GEOM.radius;
    return {x,y,angle:Math.atan2(y,x)};
  }

  function colorIndexAt(pointAngle,currentRotation){
    const sectors=PATTERNS[selectedWheel];
    const step=TAU/sectors.length;
    let rel=pointAngle-(-Math.PI/2+currentRotation);
    rel=((rel%TAU)+TAU)%TAU;
    return sectors[Math.floor(rel/step)%sectors.length];
  }

  function drawBackground(){
    const g=ctx.createRadialGradient(400,360,60,400,400,390);
    g.addColorStop(0,'#26344b');
    g.addColorStop(.48,'#131d2d');
    g.addColorStop(1,'#070b12');
    ctx.fillStyle=g;
    ctx.fillRect(0,0,800,800);

    ctx.save();
    ctx.globalAlpha=.22;
    ctx.strokeStyle='#52617a';
    ctx.lineWidth=1;
    for(let r=345;r<=385;r+=20){ctx.beginPath();ctx.arc(400,400,r,0,TAU);ctx.stroke();}
    for(let a=0;a<TAU;a+=Math.PI/12){
      ctx.beginPath();ctx.moveTo(400+Math.cos(a)*350,400+Math.sin(a)*350);ctx.lineTo(400+Math.cos(a)*382,400+Math.sin(a)*382);ctx.stroke();
    }
    ctx.restore();
  }

  function drawWheel(){
    const {cx,cy,radius}=GEOM;
    const sectors=PATTERNS[selectedWheel];
    const step=TAU/sectors.length;

    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=34;ctx.shadowOffsetY=18;
    ctx.beginPath();ctx.arc(cx,cy,radius+14,0,TAU);ctx.fillStyle='#05080e';ctx.fill();
    ctx.restore();

    // Draw the colored board first, then softly fade a neutral mask over it.
    // This makes the colors disappear gradually instead of switching instantly.
    ctx.save();
    ctx.globalAlpha = 1 - colorFade;
    for(let i=0;i<sectors.length;i++){
      const a0=-Math.PI/2+rotation+i*step;
      const a1=a0+step;
      const base=COLORS[sectors[i]].hex;
      const grad=ctx.createRadialGradient(cx-70,cy-90,30,cx,cy,radius);
      grad.addColorStop(0,lighten(base,.16));
      grad.addColorStop(1,base);
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,radius,a0,a1);ctx.closePath();
      ctx.fillStyle=grad;ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=3;ctx.stroke();
    }
    ctx.restore();

    if(colorFade>0){
      ctx.save();
      ctx.globalAlpha=colorFade;
      ctx.beginPath();ctx.arc(cx,cy,radius,0,TAU);
      const gray=ctx.createRadialGradient(cx-65,cy-85,30,cx,cy,radius);
      gray.addColorStop(0,'#7d8ba0');gray.addColorStop(1,'#3f4a5e');
      ctx.fillStyle=gray;ctx.fill();
      for(let i=0;i<sectors.length;i++){
        const a=-Math.PI/2+rotation+i*step;
        ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*radius,cy+Math.sin(a)*radius);ctx.stroke();
      }
      ctx.globalAlpha=.18*colorFade;
      ctx.beginPath();ctx.arc(cx,cy,radius*.72,0,TAU);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
      ctx.beginPath();ctx.arc(cx,cy,radius*.38,0,TAU);ctx.stroke();
      ctx.restore();
    }

    // outer rim
    ctx.beginPath();ctx.arc(cx,cy,radius+3,0,TAU);ctx.strokeStyle='#e8eef8';ctx.lineWidth=7;ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,radius+12,0,TAU);ctx.strokeStyle='rgba(103,232,249,.34)';ctx.lineWidth=2;ctx.stroke();

    // center cap
    ctx.beginPath();ctx.arc(cx,cy,13,0,TAU);ctx.fillStyle='#f8fafc';ctx.fill();
    ctx.beginPath();ctx.arc(cx,cy,5,0,TAU);ctx.fillStyle='#101827';ctx.fill();

    // board label
    ctx.textAlign='center';
    ctx.fillStyle='rgba(255,255,255,.82)';ctx.font='800 18px system-ui,sans-serif';
    ctx.fillText(`${selectedWheel} SECTORS`,cx,82);
  }

  function lighten(hex,amount){
    const n=parseInt(hex.slice(1),16);
    let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    r=Math.round(r+(255-r)*amount);g=Math.round(g+(255-g)*amount);b=Math.round(b+(255-b)*amount);
    return `rgb(${r},${g},${b})`;
  }

  function drawReticle(){
    if(phase!=='hiddenReady' || !hoverPoint || !insideBoard(hoverPoint)) return;
    const {x,y}=hoverPoint;
    ctx.save();
    ctx.strokeStyle='rgba(250,204,21,.95)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(x,y,18,0,TAU);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-30,y);ctx.lineTo(x-9,y);ctx.moveTo(x+9,y);ctx.lineTo(x+30,y);
    ctx.moveTo(x,y-30);ctx.lineTo(x,y-9);ctx.moveTo(x,y+9);ctx.lineTo(x,y+30);ctx.stroke();
    ctx.restore();
  }

  function drawDartAt(x,y,progress=1){
    // Dart enters from upper-right with a small overshoot/rotation.
    const angle=-2.34 + (1-progress)*.35;
    ctx.save();ctx.translate(x,y);ctx.rotate(angle);
    ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=9;
    // tip
    ctx.strokeStyle='#f8fafc';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-1,0);ctx.lineTo(29,0);ctx.stroke();
    // shaft
    ctx.strokeStyle='#111827';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-38,0);ctx.stroke();
    // flights
    ctx.fillStyle='#67e8f9';ctx.beginPath();ctx.moveTo(-34,0);ctx.lineTo(-54,-14);ctx.lineTo(-48,0);ctx.lineTo(-54,14);ctx.closePath();ctx.fill();
    ctx.fillStyle='#a78bfa';ctx.beginPath();ctx.moveTo(-36,0);ctx.lineTo(-52,-4);ctx.lineTo(-52,4);ctx.closePath();ctx.fill();
    // impact head
    ctx.beginPath();ctx.arc(0,0,7,0,TAU);ctx.fillStyle='#0b1220';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.restore();
  }

  function drawImpactRing(now){
    if(!impactRing) return;
    const t=(now-impactRing.start)/520;
    if(t>=1){impactRing=null;return;}
    const r=10+70*easeOutCubic(t);
    ctx.save();ctx.globalAlpha=1-t;ctx.strokeStyle='#fff';ctx.lineWidth=5*(1-t)+1;
    ctx.beginPath();ctx.arc(impactRing.x,impactRing.y,r,0,TAU);ctx.stroke();ctx.restore();
  }

  function drawThrow(now){
    if(!throwAnim) return;
    const t=clamp((now-throwAnim.start)/throwAnim.duration,0,1);
    const e=easeInCubic(t);
    const x=throwAnim.fromX+(throwAnim.toX-throwAnim.fromX)*e;
    const y=throwAnim.fromY+(throwAnim.toY-throwAnim.fromY)*e;
    drawDartAt(x,y,t);
  }

  function drawLockedDart(){
    if(!lastHit) return;
    const x=GEOM.cx+lastHit.x*GEOM.radius;
    const y=GEOM.cy+lastHit.y*GEOM.radius;
    drawDartAt(x,y,1);
  }

  function drawScene(now){
    ctx.clearRect(0,0,800,800);
    drawBackground();
    drawWheel();
    drawReticle();
    if(phase==='throwing') drawThrow(now);
    else drawLockedDart();
    drawImpactRing(now);
  }

  function beginGame(){
    if(phase==='spinningVisible'||phase==='hiddenReady'||phase==='throwing') return;
    lastHit=null;throwAnim=null;hoverPoint=null;impactRing=null;
    // Keep the wheel exactly where the previous round stopped.
    // Only the spin speed is randomized for the new round so repeated taps
    // at the same screen position do not map to a fixed color cycle.
    spinSpeed=18+Math.random()*10;
    colorHidden=false;
    colorFade=0;
    phase='spinningVisible';
    fadeStart=performance.now();

    els.resultBanner.classList.remove('show');
    els.arena.className='arena spinning';
    setPhaseUI('live','ダーツを投げよう！','');
    setMission('色がフェードアウト中','回転しながら色がふわっと消えます。消えたらすぐ狙えます。',false);
    hideOverlay();
  }

  function enterHiddenReady(){
    phase='hiddenReady';
    colorHidden=true;
    colorFade=1;
    els.arena.className='arena ready';
    setPhaseUI('ready','ダーツを投げよう！','');
    setMission('狙ってクリック！','色は見えません。的の好きな場所を直接クリック / タップしてください。',true);
    hideOverlay();
  }

  function launchDart(target){
    if(phase!=='hiddenReady' || !insideBoard(target)) return;
    phase='throwing';
    hoverPoint=null;
    hideOverlay();
    els.arena.className='arena spinning';
    setPhaseUI('live','ダーツを投げよう！','');
    setMission('ダーツ飛行中','狙った位置へダーツが飛んでいます。',false);

    throwAnim={
      start:performance.now(),duration:520,
      fromX:760,fromY:90,
      toX:target.x,toY:target.y,
      norm:normalizedPoint(target)
    };
  }

  function finishThrow(now){
    const norm=throwAnim.norm;
    const colorIndex=colorIndexAt(norm.angle,rotation);
    const color=COLORS[colorIndex];

    phase='finished';
    colorHidden=false;
    colorFade=0;
    lastHit={...norm,colorIndex};
    impactRing={x:throwAnim.toX,y:throwAnim.toY,start:now};
    throwAnim=null;
    spinSpeed=0;

    stats.totalGames++;
    stats.byWheel[selectedWheel].total++;
    stats.byWheel[selectedWheel].counts[color.key]++;

    els.arena.className='arena impact';
    setTimeout(()=>{ if(phase==='finished') els.arena.className='arena'; },360);
    setPhaseUI('done','ルーレットをクリックしよう！','');
    setMission(`${color.label}に命中！`,`ルーレットをクリックすると、すぐ次のゲームを始められます。`,false);

    const pctX=(throwAnimSafeTargetX(norm)*100).toFixed(1)+'%';
    const pctY=(throwAnimSafeTargetY(norm)*100).toFixed(1)+'%';
    els.impactFlash.style.setProperty('--hit-x',pctX);
    els.impactFlash.style.setProperty('--hit-y',pctY);
    els.impactFlash.classList.remove('fire');
    void els.impactFlash.offsetWidth;
    els.impactFlash.classList.add('fire');

    els.resultColor.style.background=color.hex;
    els.resultColor.style.color=color.hex;
    els.resultText.textContent=`${color.label} HIT!`;
    els.resultSub.textContent=`${selectedWheel}分割 / ROUND ${String(stats.totalGames).padStart(2,'0')}`;
    els.resultBanner.classList.add('show');

    renderStats();
  }

  function throwAnimSafeTargetX(norm){ return clamp(.5+(norm.x*GEOM.radius)/800,0,1); }
  function throwAnimSafeTargetY(norm){ return clamp(.5+(norm.y*GEOM.radius)/800,0,1); }

  function animationLoop(now){
    if(!lastFrame) lastFrame=now;
    const dt=clamp((now-lastFrame)/1000,0,.05);
    lastFrame=now;

    if(phase==='spinningVisible' || phase==='hiddenReady'){
      rotation=(rotation+spinSpeed*dt)%TAU;
    } else if(phase==='throwing' && throwAnim){
      const t=clamp((now-throwAnim.start)/throwAnim.duration,0,1);
      const speedFactor=Math.pow(1-t,1.4);
      rotation=(rotation+spinSpeed*speedFactor*dt)%TAU;
      if(t>=1){ finishThrow(now); }
    }

    if(phase==='spinningVisible'){
      const t=clamp((now-fadeStart)/fadeDuration,0,1);
      // Smoothstep: slow at the beginning and end for a softer disappearance.
      colorFade=t*t*(3-2*t);
      if(t>=1) enterHiddenReady();
    }

    drawScene(now);
    requestAnimationFrame(animationLoop);
  }

  function compactStatRows(data){
    return COLORS.map(c=>{
      const count=data.counts[c.key]||0;
      const pct=data.total ? count/data.total*100 : 0;
      return `
        <div class="compact-stat-row">
          <div class="compact-stat-name"><span class="dot" style="background:${c.hex};color:${c.hex}"></span>${c.label}</div>
          <div class="compact-stat-value"><strong>${pct.toFixed(1)}%</strong><small>${count} hits</small></div>
        </div>`;
    }).join('');
  }

  function renderStats(){
    els.stats4.innerHTML=compactStatRows(stats.byWheel[4]);
    els.stats8.innerHTML=compactStatRows(stats.byWheel[8]);
    els.stats4Total.textContent=`${stats.byWheel[4].total} hits`;
    els.stats8Total.textContent=`${stats.byWheel[8].total} hits`;
    els.roundHud.textContent=String(stats.totalGames+1).padStart(2,'0');
    els.boardHud.textContent=`${selectedWheel} SECTORS`;
    els.sessionHud.textContent=`${stats.totalGames} HITS`;
  }

  function selectWheel(wheel){
    if(phase==='spinningVisible'||phase==='hiddenReady'||phase==='throwing') return;
    selectedWheel=wheel;
    els.options.forEach(o=>o.classList.toggle('active',Number(o.dataset.wheel)===wheel));
    renderStats();
  }

  els.options.forEach(opt=>opt.addEventListener('click',()=>selectWheel(Number(opt.dataset.wheel))));
  els.board.addEventListener('pointermove',ev=>{
    if(phase!=='hiddenReady'){hoverPoint=null;return;}
    hoverPoint=boardPointFromPointer(ev);
  });
  els.board.addEventListener('pointerleave',()=>{hoverPoint=null;});
  els.board.addEventListener('pointerdown',ev=>{
    ev.preventDefault();
    const p=boardPointFromPointer(ev);
    if(!insideBoard(p)){
      if(phase==='hiddenReady'){
        setMission('的の内側を狙ってください','円の外ではなく、ルーレットの中をクリック / タップしてください。',true);
      }
      return;
    }

    // Idle / result screen: clicking the roulette itself starts the next game.
    if(phase==='idle' || phase==='finished'){
      beginGame();
      return;
    }

    // Once the colors have disappeared, the same click action throws the dart.
    if(phase==='hiddenReady') launchDart(p);
  });

  renderStats();
  setPhaseUI('','ルーレットをクリックしよう！','');
  requestAnimationFrame(animationLoop);
})();
</script>
</body>
</html>
